services:
  - type: web
    name: anja-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ANJA_MODEL
        value: gpt-5
      - key: OPENAI_API_KEY
        sync: false
