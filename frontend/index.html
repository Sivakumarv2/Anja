<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anja</title><style>*{box-sizing:border-box}body{margin:0;height:100vh;background:radial-gradient(circle at 10% 0,#8b5cf633,transparent 30%),radial-gradient(circle at 90% 0,#22d3ee22,transparent 30%),#070914;color:#f7f8ff;font:14px system-ui;display:grid;place-items:center}.shell{width:min(1100px,94vw);height:min(760px,92vh);border:1px solid #ffffff15;border-radius:25px;background:#0b0e1ce8;box-shadow:0 30px 100px #0009;display:flex;flex-direction:column;overflow:hidden}.top{height:65px;border-bottom:1px solid #ffffff12;padding:0 22px;display:flex;justify-content:space-between;align-items:center}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef4444;margin-right:8px}.chat{flex:1;overflow:auto;padding:40px}.hero{text-align:center;margin:8vh auto}.orb{width:78px;height:78px;margin:auto auto 18px;border-radius:25px;background:conic-gradient(#22d3ee,#8b5cf6,#f472b6,#22d3ee);box-shadow:0 0 60px #8b5cf655}.hero h1{font-size:52px;letter-spacing:-3px;margin:0;background:linear-gradient(90deg,#fff,#67e8f9);-webkit-background-clip:text;color:transparent}.hero p{color:#9aa4c3}.msg{max-width:800px;margin:0 auto 18px;display:flex}.msg.user{justify-content:flex-end}.bubble{padding:14px 16px;border:1px solid #ffffff13;background:#ffffff07;border-radius:16px;white-space:pre-wrap;line-height:1.65}.user .bubble{background:linear-gradient(135deg,#8b5cf655,#22d3ee18)}.composer{padding:15px 30px 20px}.box{max-width:800px;margin:auto;border:1px solid #ffffff1a;border-radius:19px;background:#101426;padding:10px}.drop{border-color:#22d3ee;box-shadow:0 0 30px #22d3ee22}textarea{width:100%;background:none;color:white;border:0;outline:0;resize:none;padding:8px;min-height:45px;font:14px system-ui}.row{display:flex;justify-content:space-between}.tools button{background:none;color:#9aa4c3;border:0;padding:7px;cursor:pointer}.send{background:linear-gradient(135deg,#8b5cf6,#22d3ee);border:0;border-radius:11px;width:40px;color:white}.files{max-width:800px;margin:auto;display:flex;gap:6px;flex-wrap:wrap}.file{padding:6px 9px;border:1px solid #22d3ee44;border-radius:9px;color:#aeeef7;font-size:11px}</style></head><body><div class=shell><header class=top><div><i class=dot id=dot></i><b>Anja Core</b><span id=status style="color:#9aa4c3"> · connecting</span></div><span id=provider style="color:#9aa4c3">provider: —</span></header><main class=chat id=chat><div class=hero id=hero><div class=orb></div><h1>Think beyond the obvious.</h1><p>Ask Anja questions or drop images, PDFs, Word documents and data files below.</p></div><div id=messages></div></main><div class=composer><div id=files class=files></div><div class=box id=box><textarea id=input placeholder="Ask Anja anything…"></textarea><div class=row><div class=tools><button onclick=file.click()>＋ Attach</button><input id=file type=file hidden multiple accept=".png,.jpg,.jpeg,.webp,.gif,.pdf,.docx,.txt,.md,.csv,.json"></div><button class=send onclick=send()>➤</button></div></div></div></div><script>const I=document.getElementById('input'),F=document.getElementById('file'),B=document.getElementById('box'),L=document.getElementById('files'),M=document.getElementById('messages'),H=document.getElementById('hero');let A=[];function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function upload(fs){let fd=new FormData();[...fs].forEach(x=>fd.append('files',x));let r=await fetch('/api/upload',{method:'POST',body:fd});if(!r.ok)throw Error(await r.text());let d=await r.json();A.push(...d.files);L.innerHTML=A.map(x=>'<span class=file>◫ '+esc(x.name)+'</span>').join('')}F.onchange=()=>upload(F.files).catch(e=>alert(e.message));['dragenter','dragover'].forEach(e=>B.addEventListener(e,x=>{x.preventDefault();B.classList.add('drop')}));['dragleave','drop'].forEach(e=>B.addEventListener(e,x=>{x.preventDefault();B.classList.remove('drop')}));B.addEventListener('drop',e=>upload(e.dataTransfer.files).catch(x=>alert(x.message)));function add(t,u){let x=document.createElement('div');x.className='msg '+(u?'user':'');x.innerHTML='<div class=bubble>'+esc(t)+'</div>';M.appendChild(x);document.getElementById('chat').scrollTop=999999}async function send(){let t=I.value.trim();if(!t&&!A.length)return;H.style.display='none';add(t||'Analyze my attachments',true);I.value='';try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:t||'Analyze my attachments',attachment_ids:A.map(x=>x.id)})});let d=await r.json();if(!r.ok){add(d.detail||d.answer||('Backend error (HTTP '+r.status+').'),false)}else{add(d.answer||'Anja returned no answer.',false);A=[];L.innerHTML='';}load()}catch(e){add('Anja connection error: '+e.message,false)}}async function load(){try{let r=await fetch('/api/status'),d=await r.json();document.getElementById('status').textContent=d.provider==='ollama'?' · local AI online':(d.provider==='ollama_offline'?' · Ollama not running':' · online');document.getElementById('provider').textContent='provider: '+d.provider+' · '+d.model;document.getElementById('dot').style.background=d.provider==='ollama'?'#a3e635':'#f59e0b'}catch(e){document.getElementById('status').textContent=' · offline'}}I.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});load();</script></body></html>
